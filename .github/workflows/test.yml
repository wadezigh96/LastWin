name: test

on:
  push:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install deps
        run: forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts@v4.9.6
      - name: Build
        run: forge build --sizes
      - name: Test
        run: forge test -vvv
